<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL shortener</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 20px; }
    input { box-sizing: border-box; width: 100%; padding: 10px; }
    button { margin-top: 12px; padding: 10px 20px; }
    #result { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>URLshortener</h1>
  <form id="form">
    <label for="url">Adres strony</label>
    <input id="url" type="url" placeholder="https://example.com" required>
    <button type="submit">Skróć link</button>
  </form>
  <p id="result" aria-live="polite"></p>

  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.textContent = "Zapisywanie...";

      try {
        const response = await fetch("/api/links", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: document.getElementById("url").value })
        });

        if (!response.ok) {
          throw new Error("error);
        }

        const data = await response.json();
        const link = document.createElement("a");
        link.href = data.short_url;
        link.textContent = new URL(data.short_url, window.location.origin).href;
        result.replaceChildren(link);
      } catch (error) {
        result.textContent = "err";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
