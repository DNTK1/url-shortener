name: Backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend.yml

permissions:
  contents: write
  packages: write

concurrency:
  group: backend-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Logowanie do GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Budowa i publikacja
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/dntk1/url-shortener-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/DNTK1/url-shortener

      - name: Manifest
        run: |
          sed -i "s|ghcr.io/dntk1/url-shortener-backend:.*|ghcr.io/dntk1/url-shortener-backend:${GITHUB_SHA}|" k8s/backend.yml
          if git diff --quiet -- k8s/backend.yml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/backend.yml
          git commit -m "Aktualizacja obrazu backendu"
          git pull --rebase origin main
          git push origin HEAD:main
