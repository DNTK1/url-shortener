name: Backend

on:
  push:
    branches:
      - feat/proxmox-vms
      - main
    paths:
      - backend/**
      - .github/workflows/backend.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Logowanie do GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Budowa i publikacja
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/dntk1/url-shortener-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/DNTK1/url-shortener
